{% extends "shared/base.html" %}

{% block title %}Editar Licitación - Licitarte{% endblock %}

{% block content %}
<div class="page-header">
    <h2>✏️ Editar Licitación</h2>
    <button onclick="window.location.href='/gestion'" class="btn-secondary">← Volver a Gestión</button>
</div>

<form id="licitacionForm" class="form-container">
    <input type="hidden" id="licitacionId">
    
    <div style="background: #1a1a1a; padding: 20px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid var(--primary);">
        <h3 style="color: var(--primary); margin-bottom: 15px; font-size: 14px; font-weight: 600;">📋 DATOS DE LICITACIÓN</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 15px; margin-bottom: 15px;">
            <div class="form-group">
                <label style="font-size: 13px; font-weight: 600;">N° Licitación *</label>
                <input type="text" id="numeroLicitacion" required style="font-size: 16px; padding: 12px; border: 1px solid #444; border-radius: 5px; background: var(--bg-dark); color: var(--text);">
            </div>
            <div class="form-group">
                <label style="font-size: 13px; font-weight: 600;">Fecha de Carga</label>
                <input type="text" id="fechaCarga" readonly style="background: #333; cursor: not-allowed; font-size: 16px; padding: 12px; border: 1px solid #444; border-radius: 5px; color: var(--primary); font-weight: bold;">
            </div>
            <div class="form-group">
                <label style="font-size: 13px; font-weight: 600;">Fecha de Apertura *</label>
                <input type="date" id="fecha" required style="font-size: 16px; padding: 12px; border: 1px solid #444; border-radius: 5px; background: var(--bg-dark); color: var(--text);">
            </div>
            <div class="form-group">
                <label style="font-size: 13px; font-weight: 600;">Hora de Apertura *</label>
                <input type="time" id="horaApertura" required style="font-size: 16px; padding: 12px; border: 1px solid #444; border-radius: 5px; background: var(--bg-dark); color: var(--text);">
            </div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
            <div class="form-group">
                <label style="font-size: 13px; font-weight: 600;">Cliente *</label>
                <select id="clienteSelect" required onchange="seleccionarCliente()" style="font-size: 16px; padding: 12px; border: 1px solid #444; border-radius: 5px; background: var(--bg-dark); color: var(--text);">
                    <option value="">Seleccione cliente...</option>
                </select>
            </div>
            <div class="form-group">
                <label style="font-size: 13px; font-weight: 600;">Organismo/Jurisdicción</label>
                <input type="text" id="clienteOrganismo" readonly style="background: #333; cursor: not-allowed; font-size: 16px; padding: 12px; border: 1px solid #444; border-radius: 5px; color: var(--primary); font-weight: bold;">
            </div>
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
            <label style="font-size: 13px; font-weight: 600;">Tipo de Licitación</label>
            <select id="tipoLicitacionSelect" style="font-size: 16px; padding: 12px; border: 1px solid #444; border-radius: 5px; background: var(--bg-dark); color: var(--text);">
                <option value="">Seleccione tipo...</option>
            </select>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 15px;">
            <div class="form-group">
                <label style="font-size: 13px; font-weight: 600;">Portal/Origen</label>
                <select id="portalOrigen" style="font-size: 16px; padding: 12px; border: 1px solid #444; border-radius: 5px; background: var(--bg-dark); color: var(--text);">
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <div class="form-group">
                <label style="font-size: 13px; font-weight: 600;">Modalidad de Entrega</label>
                <select id="modalidadEntrega" style="font-size: 16px; padding: 12px; border: 1px solid #444; border-radius: 5px; background: var(--bg-dark); color: var(--text);">
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <div class="form-group">
                <label style="font-size: 13px; font-weight: 600;">Forma de Pago</label>
                <select id="formaPago" style="font-size: 16px; padding: 12px; border: 1px solid #444; border-radius: 5px; background: var(--bg-dark); color: var(--text);">
                    <option value="">Seleccione...</option>
                </select>
            </div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 15px; margin-bottom: 15px;">
            <div class="form-group">
                <label style="font-size: 13px; font-weight: 600;">Mantenimiento de Oferta</label>
                <select id="mantenimientoOferta" style="font-size: 16px; padding: 12px; border: 1px solid #444; border-radius: 5px; background: var(--bg-dark); color: var(--text);">
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <div></div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 15px;">
            <div class="form-group">
                <label style="font-size: 13px; font-weight: 600;">Tipo de Adjudicación</label>
                <select id="tipoAdjudicacion" onchange="manejarTipoAdjudicacion()" style="font-size: 16px; padding: 12px; border: 1px solid #444; border-radius: 5px; background: var(--bg-dark); color: var(--text);">
                    <option value="Parcial">Parcial</option>
                    <option value="Total">Total</option>
                </select>
            </div>
            <div class="form-group">
                <label style="font-size: 13px; font-weight: 600;">Observaciones</label>
                <input type="text" id="observaciones" placeholder="Notas adicionales..." style="font-size: 16px; padding: 12px; border: 1px solid #444; border-radius: 5px; background: var(--bg-dark); color: var(--text);">
            </div>
        </div>
    </div>

    <div style="background: #1a1a1a; padding: 20px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid var(--primary);">
        <h3 style="color: var(--primary); margin-bottom: 15px; font-size: 14px; font-weight: 600;">📦 PRODUCTOS</h3>
        <div id="productosContainer"></div>
        <div style="text-align: center; margin-top: 20px;">
            <button type="button" onclick="agregarProducto()" class="btn-primary" style="padding: 8px 15px; font-size: 14px; border-radius: 6px; background: var(--primary); color: black; border: none; cursor: pointer; font-weight: 600;">➕ Agregar Producto</button>
        </div>
    </div>

    <div style="background: #1a1a1a; padding: 20px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid var(--primary);">
        <h3 style="color: var(--primary); margin-bottom: 15px; font-size: 14px; font-weight: 600;">📜 PÓLIZA DE GARANTÍA</h3>
        <div style="display: grid; grid-template-columns: auto 1fr 1fr 1fr; gap: 15px; align-items: end;">
            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; font-weight: 600;">
                    <input type="checkbox" id="requierePoliza" style="width: 18px; height: 18px;"> Requiere Póliza
                </label>
            </div>
            <div class="form-group">
                <label style="font-size: 13px; font-weight: 600;">% sobre Monto Total</label>
                <input type="number" step="0.01" id="porcentajePoliza" disabled oninput="calcularMontoPoliza()" placeholder="Ej: 5" style="font-size: 16px; padding: 12px; border: 1px solid #444; border-radius: 5px; background: var(--bg-dark); color: var(--text);">
            </div>
            <div class="form-group">
                <label style="font-size: 13px; font-weight: 600;">Monto Total Cotizado</label>
                <input type="text" id="montoTotalDisplay" readonly style="background: #333; cursor: not-allowed; font-size: 16px; padding: 12px; border: 1px solid #444; border-radius: 5px; font-weight: bold; color: var(--primary);">
            </div>
            <div class="form-group">
                <label style="font-size: 13px; font-weight: 600;">Monto de Póliza</label>
                <input type="text" id="montoPolizaDisplay" readonly style="background: #333; cursor: not-allowed; font-size: 16px; padding: 12px; border: 1px solid #444; border-radius: 5px; font-weight: bold; color: var(--primary);">
            </div>
        </div>
        <input type="hidden" id="montoPoliza">
    </div>

    <div id="margenTotalContainer" style="background: #1a1a1a; padding: 20px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid var(--primary); display: none;">
        <h3 style="color: var(--primary); margin-bottom: 15px; font-size: 14px; font-weight: 600;">💰 MARGEN TOTAL DE GANANCIA</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 15px;">
            <div class="form-group">
                <label style="font-size: 13px; font-weight: 600;">Costo Total</label>
                <input type="text" id="costoTotalDisplay" readonly style="background: #333; cursor: not-allowed; font-size: 16px; padding: 12px; border: 1px solid #444; border-radius: 5px; font-weight: bold; color: var(--primary);">
            </div>
            <div class="form-group">
                <label style="font-size: 13px; font-weight: 600;">Precio Total Ofertado</label>
                <input type="text" id="precioTotalDisplay" readonly style="background: #333; cursor: not-allowed; font-size: 16px; padding: 12px; border: 1px solid #444; border-radius: 5px; font-weight: bold; color: var(--primary);">
            </div>
            <div class="form-group">
                <label style="font-size: 13px; font-weight: 600;">Margen Total ($)</label>
                <input type="text" id="margenTotalDisplay" readonly style="background: #333; cursor: not-allowed; font-size: 16px; padding: 12px; border: 1px solid #444; border-radius: 5px; font-weight: bold; color: var(--success-color);">
            </div>
            <div class="form-group">
                <label style="font-size: 13px; font-weight: 600;">Margen Total (%)</label>
                <input type="text" id="margenTotalPorcentajeDisplay" readonly style="background: #333; cursor: not-allowed; font-size: 16px; padding: 12px; border: 1px solid #444; border-radius: 5px; font-weight: bold; color: var(--success-color);">
            </div>
        </div>
    </div>

    <div style="display: flex; gap: 15px; justify-content: flex-end; margin-top: 20px;">
        <button type="button" onclick="window.location.href='/gestion'" class="btn-secondary" style="padding: 12px 30px; font-size: 16px; border-radius: 6px;">Cancelar</button>
        <button type="submit" class="btn-success" style="padding: 12px 30px; font-size: 16px; border-radius: 6px;">✔ Guardar Cambios</button>
    </div>
</form>

<div id="modalNotificacion" class="modal">
    <div class="modal-content" style="max-width: 400px; text-align: center;">
        <h3 id="notificacionTitulo" style="color: var(--primary); margin-bottom: 20px;"></h3>
        <p id="notificacionMensaje" style="font-size: 16px; margin-bottom: 25px;"></p>
        <button onclick="cerrarNotificacion()" class="btn-primary" style="padding: 12px 30px;">Aceptar</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/modules/editar-licitacion/editar_licitacion.js"></script>
{% endblock %}
