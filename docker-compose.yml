version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: licitarte_postgres
    environment:
      POSTGRES_USER: licitarte
      POSTGRES_PASSWORD: licitarte123
      POSTGRES_DB: licitarte_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
