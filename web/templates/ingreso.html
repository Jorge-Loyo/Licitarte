{% extends "base.html" %}

{% block title %}Nueva Licitación - Licitarte{% endblock %}

{% block content %}
<div class="page-header">
    <h2>➕ Nueva Licitación</h2>
</div>

<form id="licitacionForm" class="form-container">
    <div class="form-section">
        <h3>Datos de Licitación</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
                <label>N° Licitación *</label>
                <input type="text" id="numeroLicitacion" required>
            </div>
            <div class="form-group">
                <label>Tipo de Licitación</label>
                <select id="tipoLicitacionSelect">
                    <option value="">Seleccione tipo...</option>
                </select>
                <button type="button" onclick="nuevoTipoLicitacion()" class="btn-secondary" style="margin-top: 5px;">+ Nuevo Tipo</button>
            </div>
        </div>
        <div class="form-group">
            <label>Cliente *</label>
            <select id="clienteSelect" required>
                <option value="">Seleccione cliente...</option>
            </select>
            <button type="button" onclick="window.location.href='/administracion'" class="btn-secondary" style="margin-top: 5px;">+ Nuevo Cliente</button>
        </div>
        <div class="form-group">
            <label>Fecha *</label>
            <input type="date" id="fecha" required>
        </div>
    </div>

    <div class="form-section">
        <h3>Productos</h3>
        <div id="productosContainer"></div>
    </div>

    <div style="display: flex; gap: 10px;">
        <button type="button" onclick="agregarProducto()" class="btn-primary">+ Agregar Producto</button>
        <button type="submit" class="btn-success">Guardar Licitación</button>
    </div>
</form>

<div id="mensaje" class="mensaje"></div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/ingreso.js') }}"></script>
{% endblock %}
