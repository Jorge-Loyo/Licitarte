services:
  - type: web
    name: licitarte
    env: python
    buildCommand: "cd web && pip install -r requirements.txt"
    startCommand: "cd web && python prestart.py && gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: USE_POSTGRES
        value: true
